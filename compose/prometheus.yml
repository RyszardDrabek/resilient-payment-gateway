global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: payment-gateway-api
    static_configs:
      - targets: ["api:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
