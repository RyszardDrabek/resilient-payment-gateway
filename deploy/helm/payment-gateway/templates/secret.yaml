apiVersion: v1
kind: Secret
metadata:
  name: {{ include "payment-gateway.fullname" . }}-secrets
  labels:
    {{- include "payment-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  Auth__JwtSigningKey: {{ .Values.secrets.jwtSigningKey | quote }}
  ConnectionStrings__PaymentDb: "Host={{ .Values.config.database.host }};Port={{ .Values.config.database.port }};Database={{ .Values.config.database.databaseName }};Username={{ .Values.config.database.username }};Password={{ .Values.secrets.dbPassword }};SslMode={{ .Values.config.database.sslMode }}"
  ConnectionStrings__RiskDb: "Host={{ .Values.config.database.host }};Port={{ .Values.config.database.port }};Database={{ .Values.config.database.databaseName }};Username={{ .Values.config.database.username }};Password={{ .Values.secrets.dbPassword }};SslMode={{ .Values.config.database.sslMode }}"
  RabbitMq__Password: {{ .Values.secrets.rabbitmqPassword | quote }}
