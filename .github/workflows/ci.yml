name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PaymentGateway.slnx
      - name: Format
        run: dotnet format PaymentGateway.slnx --verify-no-changes
      - name: Build
        run: dotnet build PaymentGateway.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/PaymentGateway.UnitTests/PaymentGateway.UnitTests.csproj -c Release --no-build
      - name: Architecture tests
        run: dotnet test tests/PaymentGateway.ArchitectureTests/PaymentGateway.ArchitectureTests.csproj -c Release --no-build
      - name: Integration tests
        run: dotnet test tests/PaymentGateway.IntegrationTests/PaymentGateway.IntegrationTests.csproj -c Release --no-build
