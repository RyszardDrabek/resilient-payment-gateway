name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend Build & Tests (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PaymentGateway.slnx
      - name: Format
        run: dotnet format PaymentGateway.slnx --verify-no-changes
      - name: Build
        run: dotnet build PaymentGateway.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/PaymentGateway.UnitTests/PaymentGateway.UnitTests.csproj -c Release --no-build
      - name: Architecture tests
        run: dotnet test tests/PaymentGateway.ArchitectureTests/PaymentGateway.ArchitectureTests.csproj -c Release --no-build
      - name: Integration tests
        run: dotnet test tests/PaymentGateway.IntegrationTests/PaymentGateway.IntegrationTests.csproj -c Release --no-build

  portal:
    name: Portal Build & Tests (React 19 & Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/PaymentGateway.Portal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/PaymentGateway.Portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck & Build
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-End tests (Playwright)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/PaymentGateway.Portal/playwright-report/
          retention-days: 14

  docker-build:
    name: Container Packaging Validation
    runs-on: ubuntu-latest
    needs: [backend, portal]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/Dockerfile.api
          push: false
          tags: payment-gateway-api:ci
      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/Dockerfile.worker
          push: false
          tags: payment-gateway-worker:ci
      - name: Build Portal image
        uses: docker/build-push-action@v6
        with:
          context: src/PaymentGateway.Portal
          file: src/PaymentGateway.Portal/Dockerfile
          push: false
          tags: payment-gateway-portal:ci

  helm-validate:
    name: Kubernetes & Helm Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint Helm Chart
        run: helm lint deploy/helm/payment-gateway
      - name: Template Helm Chart (Dry-run validation)
        run: helm template payment-gateway deploy/helm/payment-gateway
